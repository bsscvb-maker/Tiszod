<script>
const hobbyLogos = new Map([
 ['backwoods hunt club', { file: 'backwoods.svg', fallback: '🌲' }],
 ['big ugly brewing – ton up club', { file: 'big-ugly-official.png' }],
 ['indian cove resort', { file: 'indian-cove.webp', fallback: '🏕', official: true }],
 ['tidewater striders', { file: 'tidewater-striders.png', fallback: '👟', official: true }],
 ['windsor hunt club', { file: 'windsor.svg', fallback: '🦌' }]
]);

function recreationFolderCover(path){
 if(path.length!==2)return undefined;
 const name=String(path[1]).trim().toLowerCase().replace(/\s*[-–—]\s*/g,' – ').replace(/^backwoods huntclub$/,'backwoods hunt club');
 const logo=hobbyLogos.get(name);
 return logo?'assets/hobbies/'+logo.file:undefined;
}
async function bigUglyMemberships(folder){
 const items=await thDriveRecords.children(folder);
 const history=items.find(item=>item.folder&&/^Membership History$/i.test(item.name));
 const archived=history?await thDriveRecords.children(history):[];
 const year=item=>Number(item.name.match(/\b20\d{2}\b/)?.[0]||0);
 return [...items,...archived]
  .filter(item=>!item.folder&&/membership/i.test(item.name))
  .sort((a,b)=>year(b)-year(a));
}
window.thStart=async()=>{
 window.thRecreationSearchEntries=undefined;
 const status=document.getElementById('hobby-status');
 status.textContent='Loading folders…';
 try{
  const rows=await thValues("'Hobbies & Recreation Links'!A2:B30",'UNFORMATTED_VALUE');
  const searchEntries=[];
  let backwoodsFolder,indianCoveFolder,tidewaterFolder;
  for(const [name,link] of rows){
   if(!name||!link)continue;
   let url;
   try { url = new URL(link); } catch { continue; }
   if (url.origin !== 'https://drive.google.com') continue;
   const id = url.pathname.match(/^\/drive\/folders\/([\w-]+)\/?$/)?.[1];
   if (!id) continue;
   const rawKey = url.searchParams.get('resourcekey');
   const resourceKey = /^[\w-]+$/.test(rawKey || '') ? rawKey : null;
   const isBackwoods = id === '1t_Vz7x1KGJyEm3-fcRNPZpe3RtJ511KK' ||
     String(name).toLowerCase().replace(/\s+/g, '') === 'backwoodshuntclub';
   const indianCove = String(name).trim().toLowerCase() === 'indian cove resort';
   const tidewaterStriders = String(name).trim().toLowerCase() === 'tidewater striders';
   const folder = { name, id, folder: true, url: url.href, resourceKey, indianCove, tidewaterStriders, coverFor:recreationFolderCover, coverPath:['hobbies',name] };
   if (/^big ugly brewing\b/i.test(name)) {
    folder.recreationMemberships=true;
    folder.virtualFiles=()=>bigUglyMemberships(folder);
   }
   if (tidewaterStriders) tidewaterFolder=folder;
   if (indianCove) indianCoveFolder=folder;
   if(isBackwoods){folder.readerUrl='backwoods-bylaws.html';backwoodsFolder=folder}
   searchEntries.push(folder);
  }
  window.thRecreationSearchEntries=searchEntries;
  status.textContent=searchEntries.length?'':'No club folders are configured.';
  const page = new URL(location.href);
  const selectedFolder={backwoods:backwoodsFolder,'indian-cove':indianCoveFolder,'tidewater-striders':tidewaterFolder}[page.searchParams.get('folder')];
  if (selectedFolder) {
   page.searchParams.delete('folder');
   history.replaceState(history.state, '', page);
   thDriveRecords.open(selectedFolder);
  }
 }catch(error){status.textContent='Could not load recreation folders.';throw error}
};
</script><script src="person-portraits.js?v=1"></script><script src="family-collections.js?v=20261108-recreation-photos"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="portal.js?v=20261108-navigation-audit"></script><script src="sheets.js?v=20261104-read-retry-1"></script><script src="module-search.js?v=20261108-recreation-lazy"></script></body></html>
