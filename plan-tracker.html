<link rel="stylesheet" href="auth.css?v=5"><style>html.th-session-pending #th-auth{display:none!important}</style><script>try{const saved=JSON.parse(localStorage.getItem('thbudget-session-photos-v1')||sessionStorage.getItem('thbudget-session-photos-v1')||'null');if(saved?.expiresAt>Date.now()+30000){document.documentElement.classList.add('th-session-pending');setTimeout(()=>document.documentElement.classList.remove('th-session-pending'),15000)}}catch(_){}</script><link rel="icon" type="image/svg+xml" href="tiszod-crest.svg?v=1"><style>@scope (.tracker-native){
  :scope{margin:0;background:#000;color:#fff;font-family:Verdana,Arial,sans-serif;}
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;border-bottom:1px solid #222;background:#050505;
    position:sticky;top:0;z-index:50;
  }
  h1{margin:0;font-size:20px;}
  .sub{opacity:.75;font-size:12px;margin-top:2px;}
  #addTaskBtn{
    background:#1a73e8;color:#fff;border:none;border-radius:10px;
    padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;
  }
  #addTaskBtn:hover{background:#2b7de9;}

  .wrap{max-width:1200px;margin:auto;padding:18px;}

  .note{
    border:1px solid #2a2a2a;background:#0d0d0d;border-radius:12px;
    padding:12px 14px;margin:0 0 14px;font-size:12px;line-height:1.45;opacity:.92;
  }

  /* ===== Savage Banner ===== */
  #savageZone{display:none;margin:0 0 14px;}
  .savage{
    border:2px solid #7a0000;background:#2b0000;border-radius:12px;
    padding:14px;
  }
  .savage h3{margin:0 0 6px;color:#ffb3b3;font-size:16px;}
  .savage p{margin:6px 0;font-size:13px;line-height:1.4;}
  .savage .meta{opacity:.85;font-size:12px;}
  .savage .actions{margin-top:10px;}
  .savage button{
    background:#000;color:#fff;border:1px solid #555;border-radius:10px;
    padding:7px 10px;margin-right:8px;cursor:pointer;font-size:12px;
  }
  .savage button:hover{border-color:#aaa;}

  /* ===== Board ===== */
  .tier{
    border:1px solid #333;border-radius:14px;padding:14px;margin:0 0 16px;background:#111;
  }
  .tier h2{margin:0 0 10px;font-size:18px;}
  .tier .tierHint{opacity:.75;font-size:12px;margin-bottom:10px;}
  .row{
    display:grid;
    grid-template-columns: 28px 1fr 130px 230px 70px;
    gap:26px;
    align-items:center;
    margin:8px 0;
  }
  input[type="checkbox"]{width:18px;height:18px;cursor:pointer;}
  .taskText{
    font-weight:600;font-size:13px;line-height:1.3;
  }
  .taskText.done{text-decoration:line-through;opacity:.45;}
  .taskText.waiting{opacity:.70;font-style:italic;}

  select, input[type="text"]{
    background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:10px;
    padding:7px 10px;font-size:12px;
  }

  .status-ready{color:#ff4d4d;font-weight:800;}
  .status-working{color:#4da6ff;font-weight:800;}
  .status-waiting{color:#ffd24d;font-weight:800;}
  .status-done{color:#5cff5c;font-weight:800;}

  .btns{display:flex;gap:8px;justify-content:flex-end;}
  .iconBtn{
    background:#000;border:1px solid #555;color:#fff;border-radius:10px;
    padding:7px 10px;cursor:pointer;font-size:12px;
  }
  .iconBtn:hover{border-color:#aaa;}
  .danger:hover{border-color:#ff6b6b;}

  /* ===== Hall of Shame ===== */
  .hall{
    border:1px solid #333;border-radius:14px;padding:12px;background:#0b0b0b;
    margin-top:12px;
  }
  .hall h3{margin:0 0 10px;}
  .log{font-size:11px;opacity:.92;border-bottom:1px solid #222;padding:7px 0;}
  .pill{
    display:inline-block;padding:2px 7px;border:1px solid #444;border-radius:999px;
    font-size:10px;margin-right:6px;opacity:.95;
  }

  /* ===== Modal ===== */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;}
  #modalBox{
    width:390px;max-width:92vw;margin:110px auto;background:#111;border:1px solid #444;
    border-radius:14px;padding:16px;
  }
  #modalBox h3{margin:0 0 12px;}
  #modalBox label{display:block;font-size:12px;opacity:.85;margin:8px 0 6px;}
  #modalBox .error{
    display:none;color:#ff6b6b;font-size:12px;margin:0 0 6px;
  }
  #modalActions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
  #modalActions button{
    background:#000;color:#fff;border:1px solid #555;border-radius:10px;
    padding:8px 12px;cursor:pointer;font-size:12px;
  }
  #modalActions button:hover{border-color:#aaa;}

  /* Small screens */
  @media(max-width:900px){
    .row{grid-template-columns: 28px 1fr 120px 1fr 70px;}
  }
  @media(max-width:650px){
    .row{grid-template-columns: 28px 1fr;}
    .row > *:nth-child(3),
    .row > *:nth-child(4),
    .row > *:nth-child(5){grid-column:2;}
    .btns{justify-content:flex-start;}
  }


*{box-sizing:border-box}:scope{background:#0b1019;color:#e8edf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#101722;padding:20px 24px;border-color:#273244;gap:16px}h1{font-size:23px}.sub{line-height:1.5;color:#9aacc1}button{min-height:40px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #60d5cd;outline-offset:3px}#addTaskBtn,#saveBtn{background:#3bc7bb;color:#062c29;border:0;font-weight:750}.wrap{max-width:1160px;padding:24px}.tracker-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{padding:16px 18px;background:#131d2b;border:1px solid #29364a;border-radius:14px}.metric strong{display:block;font-size:27px}.metric span{font-size:12px;color:#a7b8ce}.tracker-tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.tracker-tools input{flex:1;min-width:180px;padding:12px;background:#111c2a;border:1px solid #35445b;border-radius:10px;color:#fff}.filter-buttons{display:flex;gap:5px;flex-wrap:wrap}.filter-buttons button{background:#152132;color:#aebed2;border:1px solid #314056;padding:8px 12px;border-radius:9px}.filter-buttons button.active{background:#224943;color:#9ef4e9;border-color:#46b7a9}.note{background:#111a27;border-color:#29364a;color:#aabbd0;margin-top:16px}.note summary{cursor:pointer;font-weight:600}.note p{line-height:1.8}.tier{background:#111a27;border-color:#29364a;padding:0;overflow:hidden;scroll-margin-top:90px}.tier>summary{display:flex;align-items:center;gap:12px;cursor:pointer;padding:18px;list-style:none}.tier>summary:before{content:"›";font-size:22px;color:#93a9c2}.tier[open]>summary:before{transform:rotate(90deg)}.tier h2{font-size:15px;margin:0;flex:1}.tier-count{font-size:12px;border:1px solid #35445b;border-radius:20px;padding:3px 9px;color:#adc1d7}.tierHint{padding:0 18px;color:#869ab3}.row{grid-template-columns:24px minmax(180px,1fr) 120px 88px;gap:14px;margin:0;padding:16px 18px;border-top:1px solid #243146}.taskText{font-size:14px;font-weight:550;line-height:1.55;overflow-wrap:anywhere}.row select{width:100%;background:#172335;border-color:#34455d;padding:8px;font-size:11px}.row .move-tier{display:none}.iconBtn{background:#172335;border-color:#34455d;padding:7px 10px}.row input[type=checkbox]{accent-color:#3bc7bb}.empty-tier{padding:4px 18px 20px;color:#8297b1;font-size:13px}.empty-results{padding:36px;text-align:center;border:1px dashed #34455d;border-radius:14px}.hall{background:#111a27;border-color:#29364a;padding:16px}.hall summary{cursor:pointer;color:#aebed2;font-size:13px}.hall .log{padding:12px 0;line-height:1.7;border-color:#29364a}.savage{background:#2b2020;border:1px solid #7b5048}.savage .actions{display:flex;gap:8px;flex-wrap:wrap}.savage button{margin:0;background:#302729;border-color:#70504c}#modal{padding:24px;overflow:auto}#modalBox{margin:7vh auto;width:480px;max-width:100%;background:#142031;border-color:#3a4e69;padding:24px}#modalBox input,#modalBox select{width:100%;font-size:14px;padding:12px;background:#0d1623;border-color:#41536d}#modalBox label{margin-top:18px}#modalActions{margin-top:24px}#modalActions button{padding:10px 20px}
@media(max-width:700px){header{padding:16px}.wrap{padding:14px}.tracker-summary{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:24px minmax(0,1fr) 88px;gap:10px;padding:14px}.row>*:nth-child(3){grid-column:2;grid-row:2;width:125px}.row>*:nth-child(5){grid-column:3;grid-row:1 / span 2}.row .btns{flex-direction:column}.taskText{grid-column:2}.sub{font-size:11px;max-width:230px}.tier h2{font-size:13px}.tracker-tools input{flex-basis:100%}.filter-buttons{width:100%}.filter-buttons button{flex:1;font-size:12px;padding:7px}}
