<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Glide Fuel & Mileage</title><style>body{font:14px Arial;background:#e6edef;color:#17262d;margin:18px}h1{color:#17333c}.cards{display:flex;gap:12px;flex-wrap:wrap}.card,section{background:#f8fbfb;border:1px solid #bdcbd0;padding:16px;margin:12px 0;border-radius:6px}.card strong{display:block;font-size:25px;color:#168d98}button{background:#168d98;color:white;border:0;padding:10px;cursor:pointer;border-radius:4px}input{padding:8px;max-width:135px}form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th{background:#17333c;color:white}td,th{padding:9px;border-bottom:1px solid #bdcbd0;text-align:left}tr:nth-child(even){background:#edf3f4}.flag{background:#d8edef!important}small{color:#596d74}</style><h1>2023 Electra Glide Ultra Classic FLHTCUI · Fuel & Mileage</h1><small>Fuelly historical records. Saved edits stay in this browser.</small><div class="cards" id="cards"></div><section><h2>Add / edit fill-up</h2><form id="f"><label>Date<input type="date" id="d" required></label><label>Odometer<input type="number" id="o" required></label><label>Gallons<input type="number" step=".001" id="g" required></label><label>Price/gal<input type="number" step=".001" id="p" required></label><label>Total paid<input type="number" step=".01" id="t"></label><button>Save fill-up</button><button type="button" onclick="cancel()">Cancel</button></form></section><section><h2>Fuel history</h2><p>May 28, 2026 is the baseline fuel-up. MPG will calculate after the next fill-up.</p><button onclick="exportCsv()">Export CSV</button><div class="scroll"><table><thead><tr><th>Date</th><th>Odometer</th><th>Miles</th><th>Gallons</th><th>$/gal</th><th>Total</th><th>MPG</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table></div></section><script>const initial=[{d:'2026-05-28',o:87483,g:6.253,p:4.399,t:27.51}];let data;try{data=JSON.parse(localStorage.getItem('tiszod-f150-fuel-v1'))||initial}catch{data=initial}let idx=-1;function save(){localStorage.setItem('tiszod-f150-fuel-v1',JSON.stringify(data));render()}function cancel(){idx=-1;document.getElementById('f').reset()}function edit(i){idx=i;for(let k of ['d','o','g','p','t'])document.getElementById(k).value=data[i][k];scrollTo(0,0)}function del(i){if(confirm('Delete this fill-up?')){data.splice(i,1);save()}}document.getElementById('f').onsubmit=e=>{e.preventDefault();let x={};for(let k of ['d','o','g','p','t'])x[k]=k==='d'?document.getElementById(k).value:+document.getElementById(k).value;if(!x.t)x.t=Math.round(x.g*x.p*100)/100;if(data.some((v,i)=>i!==idx&&v.o===x.o))return alert('Odometer already recorded');if(idx<0)data.push(x);else data[idx]=x;cancel();save()};function computed(){let prev=null;return [...data].sort((a,b)=>a.o-b.o).map(x=>{let miles=prev===null?null:x.o-prev;prev=x.o;return {...x,miles,mpg:miles===null?null:miles/x.g}})}function render(){let a=computed(),total=a.reduce((n,x)=>n+x.t,0),gal=a.reduce((n,x)=>n+x.g,0),good=a.filter(x=>x.mpg>=20&&x.mpg<=60),avg=good.reduce((n,x)=>n+x.miles,0)/good.reduce((n,x)=>n+x.g,0);document.getElementById('cards').innerHTML=[['Fill-ups',a.length],['Latest odometer',a.at(-1)?.o.toLocaleString()||'—'],['Fuel spent','$'+total.toFixed(2)],['Gallons',gal.toFixed(3)],['Average MPG',Number.isFinite(avg)?avg.toFixed(1):'—']].map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('');document.getElementById('body').innerHTML=a.reverse().map(x=>{let i=data.findIndex(v=>v.o===x.o);return '<tr class="'+(x.mpg>65?'flag':'')+'"><td>'+x.d+'</td><td>'+x.o.toLocaleString()+'</td><td>'+(x.miles??'—')+'</td><td>'+x.g.toFixed(3)+'</td><td>$'+x.p.toFixed(3)+'</td><td>$'+x.t.toFixed(2)+'</td><td>'+(x.mpg===null?'—':x.mpg.toFixed(1))+'</td><td><button onclick="edit('+i+')">Edit</button> <button onclick="del('+i+')">Delete</button></td></tr>'}).join('')}function exportCsv(){let csv='date,odometer,miles,gallons,price_per_gallon,total,mpg\n'+computed().map(x=>[x.d,x.o,x.miles??'',x.g,x.p,x.t,x.mpg??''].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='f150-fuel.csv';a.click()}render();</script>
