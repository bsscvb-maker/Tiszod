<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TisZod · Fuel history</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#edf4fc;font:14px/1.5 system-ui,sans-serif}main{padding:18px}h1{font-size:24px;margin:0}p,small{color:#b5c6d8}button,a.action{display:inline-block;min-height:44px;border:1px solid #58738d;border-radius:8px;padding:10px 14px;background:#243b52;color:white;font:650 13px system-ui;cursor:pointer;text-decoration:none}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button.primary{background:#bde992;color:#13221a;border-color:#bde992}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.card{padding:14px;background:#192b41;border:1px solid #354c65;border-radius:10px;font-size:11px;color:#abc0d4}.card strong{display:block;font-size:23px;color:#eff7ff;margin-top:6px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}td,th{padding:12px;text-align:left;border-bottom:1px solid #31465e;white-space:nowrap}th{font-size:11px;color:#a5bed5}td{font-size:13px}.note{white-space:normal;min-width:180px;max-width:300px}td a{color:#a9e9c6;margin-right:10px}.chart{margin:20px 0;background:#15263b;border:1px solid #354c65;border-radius:10px;padding:14px;overflow:auto}svg{min-width:620px;width:100%;height:220px}#status{padding:12px 0}#status:empty{display:none}.flag{color:#f4ce83}select{padding:9px;background:#16283e;color:white;border:1px solid #526e8c;border-radius:6px;font:14px system-ui}
</style></head><body><main><small id="vehicleName">VEHICLE FUEL RECORDS</small><h1>Fuel & mileage</h1><div class="actions"><button class="primary" id="add">＋ Log Fuel</button><button id="refresh">Refresh</button><button id="export">Export CSV</button><label>Year <select id="year"><option value="all">All years</option></select></label></div><p id="status" role="status">Loading your fuel history…</p><div class="cards" id="cards"></div><div class="chart"><strong>MPG trend</strong><div id="chart"></div><small>MPG uses the distance and fuel since the previous full tank. Partial fills are included at the next full tank; uncertain fills and flagged gaps are excluded.</small></div><div class="scroll"><table><thead><tr><th>Date</th><th>Odometer</th><th>Distance</th><th>Gallons</th><th>$/gal</th><th>Spent</th><th>MPG</th><th>Receipt / notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="fuel-core.js?v=20261029-fuel1"></script><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),vehicle={key:q.get('vehicle'),name:q.get('name')||'Vehicle'},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let entries=[];
 const safeLink=(url,label)=>/^https:\/\/drive\.google\.com\//.test(url||'')?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+label+'</a>':'';
 $('vehicleName').textContent=vehicle.name;
 async function load(){try{if(parent===window||!parent.TisFuelStore)throw Error('Open this fuel history from Vehicles.');$('status').textContent='Loading…';entries=await parent.TisFuelStore.history(vehicle);const selected=$('year').value,years=[...new Set(entries.map(x=>x.date.slice(0,4)))].sort().reverse();$('year').innerHTML='<option value="all">All years</option>'+years.map(y=>'<option>'+esc(y)+'</option>').join('');$('year').value=years.includes(selected)?selected:'all';render();$('status').textContent='New fill-ups are saved with your private vehicle and finance records. Historical imports are included below.';}catch(error){$('status').textContent=error.message;}}
 function render(){const all=FuelCore.records(entries),a=all.filter(x=>$('year').value==='all'||x.date.startsWith($('year').value)),good=a.filter(x=>x.mpg&&!x.flag),money=n=>'$'+n.toFixed(2),spent=a.reduce((s,x)=>s+x.total,0),gallons=a.reduce((s,x)=>s+x.gallons,0);$('cards').innerHTML=[['Fill-ups',a.length],['Latest odometer',a.length?Math.max(...a.map(x=>x.odo)).toLocaleString():'—'],['Fuel purchased',gallons.toFixed(3)+' gal'],['Total spent',money(spent)],['Average MPG',good.length?(good.reduce((s,x)=>s+x.mpg,0)/good.length).toFixed(1):'—']].map(([k,v])=>'<div class="card">'+k+'<strong>'+v+'</strong></div>').join('');
 $('rows').innerHTML=a.slice().reverse().map(e=>'<tr><td>'+esc(e.date)+'</td><td>'+e.odo.toLocaleString()+'</td><td>'+(e.miles==null?'—':e.miles.toFixed(1))+'</td><td>'+e.gallons.toFixed(3)+'</td><td>$'+e.price.toFixed(3)+'</td><td>'+money(e.total)+'</td><td class="'+(e.flag?'flag':'')+'">'+(e.mpg==null?'—':e.mpg.toFixed(1))+(e.flag?' · Review':'')+(e.full==='no'?' · Partial':e.full==='unknown'?' · Uncertain':'')+'</td><td class="note">'+safeLink(e.receiptPhoto,'Receipt')+safeLink(e.odoPhoto,'Odometer')+esc([e.station,e.notes].filter(Boolean).join(' · '))+'</td><td>'+(e.transactionId?'<button data-edit="'+esc(e.id)+'">Edit</button>':'Historical')+'</td></tr>').join('');
 const points=a.filter(e=>e.mpg&&!e.flag);if(!points.length){$('chart').textContent='Record consecutive full tanks to calculate MPG.';return;}const width=Math.max(620,points.length*55),height=220,max=Math.max(30,Math.ceil(Math.max(...points.map(e=>e.mpg))/10)*10),x=i=>45+i*(width-85)/Math.max(1,points.length-1),y=v=>175-v/max*140;let svg='<svg role="img" aria-label="Fuel economy by fill-up date" viewBox="0 0 '+width+' '+height+'" style="width:'+width+'px">';for(let i=0;i<5;i++){const v=max*i/4;svg+='<line x1="40" x2="'+(width-20)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#344b65"/><text x="8" y="'+(y(v)+4)+'" fill="#adbed2" font-size="11">'+v+'</text>';}svg+='<polyline fill="none" stroke="#bde992" stroke-width="3" points="'+points.map((e,i)=>x(i)+','+y(e.mpg)).join(' ')+'"/>';points.forEach((e,i)=>{svg+='<circle cx="'+x(i)+'" cy="'+y(e.mpg)+'" r="4" fill="#bde992"><title>'+e.date+' · '+e.mpg.toFixed(1)+' MPG</title></circle><text x="'+x(i)+'" y="'+(y(e.mpg)-12)+'" fill="#fff" text-anchor="middle" font-size="11">'+e.mpg.toFixed(1)+'</text><text x="'+x(i)+'" y="201" fill="#adbed2" text-anchor="middle" font-size="10">'+e.date.slice(5)+'</text>';});$('chart').innerHTML=svg+'</svg>';}
 $('add').onclick=()=>parent.TisFuel.open({...parent.tiszodFuelOptions(),selected:vehicle.key});$('refresh').onclick=load;$('year').onchange=render;
 $('rows').onclick=e=>{const button=e.target.closest('[data-edit]');if(button){const entry=entries.find(x=>x.id===button.dataset.edit);parent.TisFuel.open({...parent.tiszodFuelOptions(),selected:vehicle.key,entry});}};
 $('export').onclick=()=>{const columns=['date','odo','gallons','price','total','full','mpg','station','location','notes','receiptPhoto','odoPhoto'];const csv=[columns.join(','),...FuelCore.records(entries).map(e=>columns.map(k=>'"'+String(e[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='fuel-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 parent.document.addEventListener('tiszod-fuel-saved',load);window.addEventListener('unload',()=>parent.document.removeEventListener('tiszod-fuel-saved',load));load();})();
</script></body></html>
